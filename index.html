  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">  <style>

    :root {
      --bg: #fefcf6;
      --dark: #171717;
      --blue: #0d1a8a;
      --gold: #d4af37;
      --white: #ffffff;
      --muted: rgba(255,255,255,.65);
      --font-logo: "Great Vibes", cursive;
      --font-main: "Inter", sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      font-family: var(--font-main);
    }

    body {
      display: flex;
      justify-content: center;
      overflow-x: hidden;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      -webkit-appearance: none;
      appearance: none;
    }

    /* =========================
       MAIN CONTAINER
    ========================= */

    .app-container {
      width: 100%;
      max-width: 430px;
      min-height: 100vh;
      min-height: 100dvh;
      position: relative;
      overflow: hidden;
      background: #000;
      box-shadow: 0 0 30px rgba(0,0,0,.25);
    }

    /* =========================
       SCREENS
    ========================= */

    .screen {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }

    .screen.active {
      display: flex;
    }

    /* =========================
       LANGUAGE SWITCHER
    ========================= */

    .language-switcher {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 7px;
      border-radius: 30px;
      background: rgba(0,0,0,.42);
      border: 1px solid rgba(255,255,255,.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .lang-btn {
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.55);
      padding: 6px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    .lang-btn.active {
      color: #fff;
      background: rgba(255,255,255,.18);
    }

    /* =========================
       SCREEN 1
    ========================= */

    #splash-screen {
      background-image: url("673.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      cursor: pointer;
    }

    .splash-top {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      padding: 24px 20px;
      z-index: 5;
    }

    .splash-bottom {
      margin-top: auto;
      width: 100%;
      padding: 30px 24px 38px;
      text-align: center;
      background: linear-gradient(
        to top,
        rgba(0,0,0,.65),
        rgba(0,0,0,0)
      );
    }

    .touch-hint {
      color: rgba(255,255,255,.9);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    /* =========================
       SCREEN 2
    ========================= */

    #choice-screen {
      background-image: url("674.png");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .choice-language {
      position: absolute;
      top: 24px;
      right: 20px;
      z-index: 20;
    }

    /*
      Transparent buttons placed over
      the two areas of 674.png.
    */

    .choice-button {
      position: absolute;
      left: 8%;
      width: 84%;
      height: 18%;
      border: 0;
      background: transparent;
      cursor: pointer;
      z-index: 10;
    }

    #btn-kitchen {
      top: 28%;
    }

    #btn-bar {
      top: 52%;
    }

    /* =========================
       MENU SCREEN
    ========================= */

    #menu-screen {
      background: #101010;
      color: #fff;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
    }

    #menu-screen::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: url("674.png");
      background-size: cover;
      background-position: center;
      opacity: .08;
      filter: blur(12px);
      pointer-events: none;
      z-index: 0;
    }

    .menu-inner {
      position: relative;
      z-index: 2;
      min-height: 100%;
      padding-bottom: 60px;
    }

    /* =========================
       HEADER
    ========================= */

    .header {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 12px 14px;
      background: rgba(12,12,12,.90);
      border-bottom: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    .header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .back-btn {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.08);
      color: #fff;
      padding: 9px 14px;
      border-radius: 22px;
      font-size: 12px;
      cursor: pointer;
    }

    .back-btn:active {
      transform: scale(.97);
    }

    .menu-language {
      margin-left: auto;
    }

    .search-box {
      width: 100%;
      margin-top: 12px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.07);
      color: #fff;
      border-radius: 12px;
      padding: 11px 14px;
      outline: none;
      font-size: 13px;
    }

    .search-box::placeholder {
      color: rgba(255,255,255,.4);
    }

    /* =========================
       CATEGORIES
    ========================= */

    .categories-scroll {
      position: relative;
      z-index: 3;
      display: flex;
      gap: 8px;
      padding: 14px 14px 8px;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .categories-scroll::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      flex: 0 0 auto;
      border: 1px solid rgba(255,255,255,.1);
      background: rgba(255,255,255,.07);
      color: rgba(255,255,255,.7);
      padding: 9px 15px;
      border-radius: 22px;
      font-size: 12px;
      white-space: nowrap;
      cursor: pointer;
    }

    .cat-chip.active {
      background: var(--gold);
      color: #111;
      border-color: var(--gold);
      font-weight: 700;
    }

    /* =========================
       MENU ITEMS
    ========================= */

    .menu-items-list {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      gap: 11px;
      padding: 12px 14px 70px;
    }

    .food-card {
      display: flex;
      gap: 12px;
      width: 100%;
      padding: 11px;
      border-radius: 16px;
      background: rgba(28,28,28,.76);
      border: 1px solid rgba(255,255,255,.09);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      cursor: pointer;
      transition: transform .15s ease;
    }

    .food-card:active {
      transform: scale(.985);
    }

    .food-img {
      width: 82px;
      height: 82px;
      flex: 0 0 82px;
      border-radius: 12px;
      object-fit: cover;
      background: #222;
    }

    .food-info {
      min-width: 0;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .food-title {
      color: #fff;
      font-size: 15px;
      line-height: 1.2;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .food-desc {
      color: rgba(255,255,255,.58);
      font-size: 11px;
      line-height: 1.35;
      margin-bottom: 8px;
    }

    .food-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .food-price {
      color: var(--gold);
      font-size: 16px;
      font-weight: 700;
      white-space: nowrap;
    }

    .food-time {
      color: rgba(255,255,255,.38);
      font-size: 10px;
      white-space: nowrap;
    }

    .empty-message {
      text-align: center;
      padding: 60px 20px;
      color: rgba(255,255,255,.5);
      font-size: 13px;
    }

    /* =========================
       SERVICE FOOTER
    ========================= */

    .service-footer {
      position: fixed;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 100%;
      max-width: 430px;
      z-index: 50;
      text-align: center;
      padding: 8px;
      background: rgba(10,10,10,.92);
      border-top: 1px solid rgba(255,255,255,.07);
      color: var(--gold);
      font-size: 10px;
      letter-spacing: .08em;
    }

    /* =========================
       DISH MODAL
    ========================= */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 100;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0,0,0,.82);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }

    .modal.active {
      display: flex;
    }

    .modal-content {
      width: 100%;
      max-width: 430px;
      max-height: 88vh;
      overflow-y: auto;
      padding: 18px;
      background: #191919;
      color: #fff;
      border-radius: 24px 24px 0 0;
      border-top: 1px solid rgba(255,255,255,.12);
    }

    .modal-img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      border-radius: 16px;
      margin-bottom: 16px;
      background: #222;
    }

    .modal-title {
      font-size: 23px;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .modal-description {
      color: rgba(255,255,255,.65);
      font-size: 13px;
      line-height: 1.5;
    }

    .modal-price {
      color: var(--gold);
      font-size: 21px;
      font-weight: 700;
      margin: 15px 0;
    }

    .close-btn {
      width: 100%;
      border: 0;
      background: rgba(255,255,255,.1);
      color: #fff;
      padding: 13px;
      border-radius: 12px;
      font-size: 13px;
      cursor: pointer;
    }

    /* =========================
       DESKTOP
    ========================= */

    @media (min-width: 431px) {
      body {
        background: #ddd;
      }

      .app-container {
        min-height: 100vh;
      }
    }

  </style></head><body><div class="app-container">  <!-- =====================================

  ====================================== -->  <section id="splash-screen" class="screen active"><div class="splash-top">
  <div class="language-switcher" onclick="stopEvent(event)">
    <button class="lang-btn active" data-lang="az" onclick="changeLanguage('az', event)">AZ</button>
    <button class="lang-btn" data-lang="ru" onclick="changeLanguage('ru', event)">RU</button>

  </div>

<div class="splash-bottom">

  </div>

  </section>  <!-- =====================================

  ====================================== -->  <section id="choice-screen" class="screen"><div class="choice-language">
  <div class="language-switcher">
    <button class="lang-btn" data-lang="az" onclick="changeLanguage('az', event)">AZ</button>
    <button class="lang-btn" data-lang="ru" onclick="changeLanguage('ru', event)">RU</button>
    <button class="lang-btn" data-lang="en" onclick="changeLanguage('en', event)">EN</button>
  </div>
</div>

<!-- Invisible clickable areas over 674.png -->

<button
  id="btn-kitchen"
  class="choice-button"
  aria-label="Kitchen"
  onclick="openMenu('kitchen', event)">
</button>

<button
  id="btn-bar"
  class="choice-button"
  aria-label="Bar"
  onclick="openMenu('bar', event)">
</button>

  </section>  <!-- =====================================
       SCREEN 3 — MENU
  ====================================== -->  <section id="menu-screen" class="screen"><div class="menu-inner">

  <header class="header">

    <div class="header-row">

      <button
        class="back-btn"
        onclick="goBack(event)"
        id="back-button">
        ← Geri
      </button>

      <div class="menu-language">
        <div class="language-switcher">

          <button
            class="lang-btn"
            data-lang="az"
            onclick="changeLanguage('az', event)">
            AZ
          </button>

          <button
            class="lang-btn"
            data-lang="ru"
            onclick="changeLanguage('ru', event)">
            RU
          </button>

          <button
            class="lang-btn"
            data-lang="en"
            onclick="changeLanguage('en', event)">
            EN
          </button>

        </div>
      </div>

    </div>

    <input
      id="search-input"
      class="search-box"
      type="search"
      autocomplete="off"
      oninput="renderMenu()"
      placeholder="Menyuda axtar...">

  </header>


  <div
    class="categories-scroll"
    id="categories-container">
  </div>


  <main
    class="menu-items-list"
    id="menu-container">
  </main>

</div>


<div
  class="service-footer"
  id="service-footer">
  SERVİS HAQQI 10%
</div>

  </section></div><!-- =====================================
     DISH DETAIL MODAL
====================================== --><div
  id="dish-modal"
  class="modal"
  onclick="closeModalOutside(event)">  <div
    id="modal-body"
    class="modal-content">
  </div></div><script>

  /* =====================================
     APPLICATION STATE
  ====================================== */

  let currentLang = "az";
  let currentType = "kitchen";
  let currentCategory = "all";


  /* =====================================
     TRANSLATIONS
  ====================================== */

  const translations = {

    az: {
      continue: "Davam etmək üçün toxunun",
      back: "← Geri",
      search: "Menyuda axtar...",
      service: "SERVİS HAQQI 10%",
      close: "Bağla",
      minutes: "dəq.",
      noResults: "Heç bir məhsul tapılmadı."
    },

    ru: {
      continue: "Нажмите, чтобы продолжить",
      back: "← Назад",
      search: "Поиск в меню...",
      service: "СЕРВИСНЫЙ СБОР 10%",
      close: "Закрыть",
      minutes: "мин.",
      noResults: "Ничего не найдено."
    },

    en: {
      continue: "Tap to continue",
      back: "← Back",
      search: "Search menu...",
      service: "SERVICE CHARGE 10%",
      close: "Close",
      minutes: "min.",
      noResults: "No items found."
    }

  };


  /* =====================================
     MENU DATA
  ====================================== */

  const menu = [

    {
      id: 1,
      type: "kitchen",
      category: "salads",

      name: {
        az: "Klassik Sezar salatı",
        ru: "Классический салат Цезарь",
        en: "Classic Caesar Salad"
      },

      ingredients: {
        az: "Toyuq filesi, romaine salatı, kərəviz, parmesan",
        ru: "Куриное филе, салат ромэн, сельдерей, пармезан",
        en: "Chicken fillet, romaine lettuce, celery, parmesan"
      },

      price: 14.90,
      time: 15,
      image: "675.png"
    },


    {
      id: 2,
      type: "kitchen",
      category: "salads",

      name: {
        az: "Karidesli salat",
        ru: "Салат с креветками",
        en: "Shrimp Salad"
      },

      ingredients: {
        az: "Karides, kərəviz, avokado",
        ru: "Креветки, сельдерей, авокадо",
        en: "Shrimp, celery, avocado"
      },

      price: 18.50,
      time: 12,
      image: "683.png"
    },


    {
      id: 3,
      type: "kitchen",
      category: "soups",

      name: {
        az: "Kərəviz şorbası",
        ru: "Суп из сельдерея",
        en: "Celery Soup"
      },

      ingredients: {
        az: "Tərəvəz, kərəviz, qaymaq",
        ru: "Овощи, сельдерей, сливки",
        en: "Vegetables, celery, cream"
      },

      price: 7.50,
      time: 20,
      image: "683.png"
    },


    {
      id: 4,
      type: "kitchen",
      category: "breakfasts",

      name: {
        az: "Səhər yeməyi dəsti",
        ru: "Завтрак сет",
        en: "Breakfast Set"
      },

      ingredients: {
        az: "Yumurta, pendir, zeytun, yağ, bal",
        ru: "Яйца, сыр, оливки, масло, мёд",
        en: "Eggs, cheese, olives, butter, honey"
      },

      price: 12.00,
      time: 10,
      image: "681.png"
    },


    {
      id: 5,
      type: "bar",
      category: "cocktails",

      name: {
        az: "Aperol Spritz",
        ru: "Апероль Спритц",
        en: "Aperol Spritz"
      },

      ingredients: {
        az: "Aperol, prosecco, portağal",
        ru: "Апероль, просекко, апельсин",
        en: "Aperol, prosecco, orange"
      },

      price: 14.90,
      time: 5,
      image: "677.png"
    },


    {
      id: 6,
      type: "bar",
      category: "cocktails",

      name: {
        az: "Mojito",
        ru: "Мохито",
        en: "Mojito"
      },

      ingredients: {
        az: "Rom, laym, nanə",
        ru: "Ром, лайм, мята",
        en: "Rum, lime, mint"
      },

      price: 12.90,
      time: 5,
      image: "676.png"
    },


    {
      id: 7,
      type: "bar",
      category: "coffee",

      name: {
        az: "Espresso",
        ru: "Эспрессо",
        en: "Espresso"
      },

      ingredients: {
        az: "Təbii kofe dənələri",
        ru: "Натуральные кофейные зёрна",
        en: "Natural coffee beans"
      },

      price: 4.50,
      time: 3,
      image: "681.png"
    }

  ];


  /* =====================================
     CATEGORIES
  ====================================== */

  const categoriesMap = {

    kitchen: [

      {
        id: "all",
        name: {
          az: "Hamısı",
          ru: "Все",
          en: "All"
        }
      },

      {
        id: "breakfasts",
        name: {
          az: "Səhər yeməkləri",
          ru: "Завтраки",
          en: "Breakfasts"
        }
      },

      {
        id: "soups",
        name: {
          az: "Şorbalar",
          ru: "Супы",
          en: "Soups"
        }
      },

      {
        id: "salads",
        name: {
          az: "Salatlar",
          ru: "Салаты",
          en: "Salads"
        }
      }

    ],


    bar: [

      {
        id: "all",
        name: {
          az: "Hamısı",
          ru: "Все",
          en: "All"
        }
      },

      {
        id: "cocktails",
        name: {
          az: "Kokteyllər",
          ru: "Коктейли",
          en: "Cocktails"
        }
      },

      {
        id: "coffee",
        name: {
          az: "Çay / Qəhvə",
          ru: "Чай / Кофе",
          en: "Tea / Coffee"
        }
      }

    ]

  };


  /* =====================================
     LANGUAGE
  ====================================== */

  function changeLanguage(lang, event) {

    if (event) {
      event.stopPropagation();
    }

    if (!translations[lang]) {
      return;
    }

    currentLang = lang;

    document.documentElement.lang = lang;

    document.querySelectorAll(".lang-btn").forEach(button => {

      const buttonLang = button.dataset.lang;

      button.classList.toggle(
        "active",
        buttonLang === currentLang
      );

    });

    updateInterface();

  }


  function updateInterface() {

    const t = translations[currentLang];

    document.getElementById("touch-hint").textContent =
      t.continue;

    document.getElementById("back-button").textContent =
      t.back;

    document.getElementById("search-input").placeholder =
      t.search;

    document.getElementById("service-footer").textContent =
      t.service;

    renderCategories();
    renderMenu();

  }


  /* =====================================
     SCREEN NAVIGATION
  ====================================== */

  function goToChoice(event) {

    if (event) {
      event.stopPropagation();
    }

    document
      .getElementById("splash-screen")
      .classList.remove("active");

    document
      .getElementById("choice-screen")
      .classList.add("active");

  }


  function goBack(event) {

    if (event) {
      event.stopPropagation();
    }

    document
      .getElementById("menu-screen")
      .classList.remove("active");

    document
      .getElementById("choice-screen")
      .classList.add("active");

  }


  function openMenu(type, event) {

    if (event) {
      event.stopPropagation();
    }

    if (type !== "kitchen" && type !== "bar") {
      return;
    }

    currentType = type;
    currentCategory = "all";

    const search = document.getElementById("search-input");

    if (search) {
      search.value = "";
    }

    document
      .getElementById("choice-screen")
      .classList.remove("active");

    document
      .getElementById("menu-screen")
      .classList.add("active");

    renderCategories();
    renderMenu();

  }


  /* =====================================
     CATEGORIES RENDER
  ====================================== */

  function renderCategories() {

    const container =
      document.getElementById("categories-container");

    if (!container) {
      return;
    }

    container.innerHTML = "";

    const categories =
      categoriesMap[currentType] || [];

    categories.forEach(category => {

      const chip =
        document.createElement("button");

      chip.type = "button";

      chip.className =
        "cat-chip" +
        (currentCategory === category.id
          ? " active"
          : "");

      chip.textContent =
        category.name[currentLang];

      chip.onclick = function(event) {

        event.stopPropagation();

        currentCategory =
          category.id;

        renderCategories();
        renderMenu();

      };

      container.appendChild(chip);

    });

  }


  /* =====================================
     MENU RENDER
  ====================================== */

  function renderMenu() {

    const container =
      document.getElementById("menu-container");

    if (!container) {
      return;
    }

    container.innerHTML = "";

    const searchElement =
      document.getElementById("search-input");

    const searchValue =
      searchElement
        ? searchElement.value.trim().toLowerCase()
        : "";

    const filtered =
      menu.filter(item => {

        const typeMatch =
          item.type === currentType;

        const categoryMatch =
          currentCategory === "all" ||
          item.category === currentCategory;

        const name =
          item.name[currentLang] || "";

        const ingredients =
          item.ingredients[currentLang] || "";

        const searchMatch =
          !searchValue ||
          name.toLowerCase().includes(searchValue) ||
          ingredients.toLowerCase().includes(searchValue);

        return (
          typeMatch &&
          categoryMatch &&
          searchMatch
        );

      });


    if (filtered.length === 0) {

      const empty =
        document.createElement("div");

      empty.className =
        "empty-message";

      empty.textContent =
        translations[currentLang].noResults;

      container.appendChild(empty);

      return;
    }


    filtered.forEach(item => {

      const card =
        document.createElement("article");

      card.className =
        "food-card";

      card.onclick = function() {
        openDishModal(item.id);
      };


      const image =
        document.createElement("img");

      image.className =
        "food-img";

      image.src =
        item.image;

      image.alt =
        item.name[currentLang];

      image.loading =
        "lazy";

      image.onerror =
        function() {
          this.style.visibility = "hidden";
        };


      const info =
        document.createElement("div");

      info.className =
        "food-info";


      const title =
        document.createElement("div");

      title.className =
        "food-title";

      title.textContent =
        item.name[currentLang];


      const description =
        document.createElement("div");

      description.className =
        "food-desc";

      description.textContent =
        item.ingredients[currentLang];


      const bottom =
        document.createElement("div");

      bottom.className =
        "food-bottom";


      const price =
        document.createElement("span");

      price.className =
        "food-price";

      price.textContent =
        formatPrice(item.price);


      const time =
        document.createElement("span");

      time.className =
        "food-time";

      time.textContent =
        "◷ " +
        item.time +
        " " +
        translations[currentLang].minutes;


      bottom.appendChild(price);
      bottom.appendChild(time);

      info.appendChild(title);
      info.appendChild(description);
      info.appendChild(bottom);

      card.appendChild(image);
      card.appendChild(info);

      container.appendChild(card);

    });

  }


  /* =====================================
     PRICE
  ====================================== */

  function formatPrice(price) {

    return Number(price)
      .toFixed(2)
      .replace(".", ",") +
      " ₼";

  }


  /* =====================================
     DISH MODAL
  ====================================== */

  function openDishModal(id) {

    const item =
      menu.find(menuItem => menuItem.id === id);

    if (!item) {
      return;
    }

    const modal =
      document.getElementById("dish-modal");

    const body =
      document.getElementById("modal-body");


    body.innerHTML = "";


    const image =
      document.createElement("img");

    image.className =
      "modal-img";

    image.src =
      item.image;

    image.alt =
      item.name[currentLang];


    const title =
      document.createElement("h2");

    title.className =
      "modal-title";

    title.textContent =
      item.name[currentLang];


    const description =
      document.createElement("p");

    description.className =
      "modal-description";

    description.textContent =
      item.ingredients[currentLang];


    const price =
      document.createElement("div");

    price.className =
      "modal-price";

    price.textContent =
      formatPrice(item.price);


    const close =
      document.createElement("button");

    close.type =
      "button";

    close.className =
      "close-btn";

    close.textContent =
      translations[currentLang].close;

    close.onclick =
      closeDishModal;


    body.appendChild(image);
    body.appendChild(title);
    body.appendChild(description);
    body.appendChild(price);
    body.appendChild(close);


    modal.classList.add("active");

  }


  function closeDishModal(event) {

    if (event) {
      event.stopPropagation();
    }

    document
      .getElementById("dish-modal")
      .classList.remove("active");

  }


  function closeModalOutside(event) {

    if (
      event.target.id === "dish-modal"
    ) {
      closeDishModal();
    }

  }


  /* =====================================
     STOP EVENT
  ====================================== */

  function stopEvent(event) {

    if (event) {
      event.stopPropagation();
    }

  }


  /* =====================================
     INITIALIZATION
  ====================================== */

  document.addEventListener(
    "DOMContentLoaded",
    function() {

      updateInterface();

      /*
        Only the cover opens the category screen.
        Clicking AZ/RU/EN does NOT open it.
      */

      document
        .getElementById("splash-screen")
        .addEventListener("click", function(event) {

          if (
            event.target.closest(".language-switcher")
          ) {
            return;
          }

          goToChoice(event);

        });


      /*
        Close modal with Android/iPhone back gesture
        where supported.
      */

      document.addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Escape") {
            closeDishModal();
          }

        }
      );

    }
  );

</script></body>
</html>
