.cover-content{position:absolute;inset:0;z-index:2;pointer-events:none}
.cover-hotspots{position:absolute;inset:0;z-index:10;pointer-events:none}
.cover-hotspots button{position:absolute;display:block;border:0;background:transparent;padding:0;pointer-events:auto;cursor:pointer}
.hotspot-lang{top:70.2%;height:7.5%;width:11.5%;border-radius:999px}
.hotspot-lang.az{left:29.2%}.hotspot-lang.ru{left:44.3%}.hotspot-lang.en{left:59.2%}
.hotspot-continue{left:16.5%;right:16.5%;bottom:8.0%;height:8.8%;border-radius:999px}

.logo-mark{font-size:32px;color:var(--gold2);line-height:1}
.logo{font:600 clamp(58px,15vw,92px)/.9 "Cormorant Garamond",serif;letter-spacing:-2px;color:#f9e8c2;text-shadow:0 4px 30px #000}
.subtitle{font-size:11px;letter-spacing:4px;margin-top:16px;color:#f5dfb5}
.ornament{color:var(--gold);font-size:28px;margin:16px 0}
.tagline{font:400 34px "Parisienne",cursive;color:#f7dfad}
.lang{display:flex;gap:5px;padding:5px;border:1px solid var(--line);border-radius:999px;background:rgba(15,9,6,.45);backdrop-filter:blur(16px);width:max-content;margin:26px auto}
.lang button,.chip{border:0;background:transparent;color:#d9c9ae;padding:9px 15px;border-radius:999px}
.lang button.active,.chip.active{background:linear-gradient(135deg,#f6d889,#b98432);color:#25160a;box-shadow:0 5px 20px rgba(229,180,83,.24)}
.primary{border:1px solid rgba(255,231,174,.7);background:linear-gradient(135deg,#f3cf7c,#b67c2e);color:#23150a;font-weight:800;padding:17px 24px;border-radius:999px;box-shadow:0 12px 35px rgba(214,154,50,.24)}
.primary:active{transform:scale(.98)}
.glass{background:linear-gradient(145deg,rgba(50,31,20,.68),rgba(17,10,7,.5));border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:var(--shadow)}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:20;padding:6px 0 14px}
.back,.icon-btn{border:1px solid var(--line);background:rgba(20,12,8,.58);color:var(--cream);border-radius:999px;padding:10px 14px;backdrop-filter:blur(14px)}
.small-logo{text-align:center;font:600 28px "Cormorant Garamond",serif;color:var(--gold2)}
.small-logo span{display:block;font:500 7px Inter;letter-spacing:3px;color:#d8c5a3}
.hero-title{font:600 44px/1 "Cormorant Garamond",serif;margin:18px 0 6px}
.hero-sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.choice{display:grid;gap:16px;margin-top:22px}
.choice-card{position:relative;min-height:250px;border-radius:26px;overflow:hidden;padding:22px;display:flex;align-items:end;text-align:left;background-size:cover;background-position:center;border:1px solid var(--line);box-shadow:var(--shadow)}
.choice-card:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 20%,rgba(10,5,3,.9))}
.choice-card>*{position:relative;z-index:2}
.choice-kitchen{background-image:url('https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=1000&q=85')}
.choice-bar{background-image:url('https://images.unsplash.com/photo-1510812431401-41d2bd2722f3?auto=format&fit=crop&w=1000&q=85')}
.choice-title{font:600 39px "Cormorant Garamond",serif}
.choice-desc{font-size:12px;color:#ddceb5;margin:3px 0 10px}
.arrow{position:absolute;right:20px;bottom:20px;font-size:25px;color:var(--gold2)}
.search{display:flex;gap:9px;padding:10px 12px;border-radius:18px;margin:12px 0}
.search input{min-width:0;flex:1;background:transparent;border:0;outline:0;color:var(--cream);font-size:15px}
.search input::placeholder{color:#a99a86}
.chips{display:flex;gap:8px;overflow:auto;padding:3px 0 13px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:rgba(42,26,17,.6)}
.menu-list{display:grid;gap:10px}
.dish-card{display:grid;grid-template-columns:86px 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:20px;min-height:96px}
.dish-img{width:86px;height:86px;border-radius:16px;object-fit:cover}
.dish-name{font:600 22px/1 "Cormorant Garamond",serif;margin-bottom:5px}
.dish-desc{font-size:11px;line-height:1.35;color:#bcae99;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.price{font-weight:700;color:var(--gold2);white-space:nowrap}
.time{font-size:10px;color:#a99b87;margin-top:8px}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.badge{font-size:9px;padding:4px 7px;border-radius:999px;border:1px solid rgba(255,214,132,.35);color:#e5c985;background:rgba(255,197,82,.08)}
.service{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:30;white-space:nowrap;font-size:10px;letter-spacing:2px;color:#d8c59d;padding:9px 16px;border-radius:999px;background:rgba(22,12,7,.82);border:1px solid var(--line);backdrop-filter:blur(14px)}
.modal{position:fixed;inset:0;z-index:50;background:rgba(4,2,1,.72);display:flex;align-items:end;justify-content:center;padding:10px}
.modal-box{width:min(620px,100%);max-height:94svh;overflow:auto;border-radius:30px 30px 20px 20px}
.modal-img{width:100%;height:300px;object-fit:cover;border-radius:29px 29px 0 0}
.modal-body{padding:20px}
.modal-title{font:600 42px/1 "Cormorant Garamond",serif}
.modal-price{font-size:22px;color:var(--gold2);font-weight:800}
.close{float:right;border:1px solid var(--line);background:rgba(20,10,6,.55);color:#fff;border-radius:50%;width:40px;height:40px}
.divider{height:1px;background:var(--line);margin:16px 0}
.detail-text{font-size:13px;color:#d0c0a9;line-height:1.6}
.meta{display:flex;justify-content:space-between;gap:10px;margin:14px 0;color:#d4c2a3}
.empty{text-align:center;padding:50px 20px;color:#a99b87}
.fade{animation:fade .35s ease both}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(min-width:700px){.choice{grid-template-columns:1fr 1fr}.screen{padding-left:28px;padding-right:28px}.modal{align-items:center}.modal-box{border-radius:30px}}
</style>

let lang=localStorage.getItem('lb_lang')||'az', state='cover', type='kitchen', cat='all', query='';
const t=()=>T[lang];
const trName=x=>x.n[lang], trIng=x=>x.i[lang];
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function shell(content,cls=''){return `<main class="screen ${cls} fade">${content}</main><div class="service">${t().service}</div>`}
function setLang(l){lang=l;localStorage.setItem('lb_lang',l);render()}
function cover(){
 return `<main class="screen cover"><div class="cover-bg" aria-label="Le Buffet menu cover"></div>
   <div class="cover-hotspots" aria-hidden="false">
     <button class="hotspot-lang az" onclick="setLang('az')" aria-label="AZ"></button>
     <button class="hotspot-lang ru" onclick="setLang('ru')" aria-label="RU"></button>
     <button class="hotspot-lang en" onclick="setLang('en')" aria-label="EN"></button>
     <button class="hotspot-continue" onclick="state='choice';render()" aria-label="Tap to screen"></button>
   </div>
   <div class="cover-content">
   
 </div></main>`
}
function choice(){
 return shell(`<div class="topbar"><button class="back" onclick="state='cover';render()">← ${t().back}</button><div class="small-logo">Le Buffet<span>BISTRO · WINE · COFFEE</span></div><div style="width:72px"></div></div>
 <div style="text-align:center"><div class="ornament">❦</div><h1 class="hero-title">Un coin de plaisir</h1><p class="hero-sub">${lang==='az'?'Hansı atmosferdə olmağınızı istəyirsiniz?':lang==='ru'?'Какое настроение выбираете?':'Choose your mood.'}</p></div>
 <div class="choice">
  <button class="choice-card choice-kitchen" onclick="openMenu('kitchen')"><div><div class="choice-title">${t().kitchen}</div><div class="choice-desc">${t().kitchenSub}</div><small>From Fire to Table · С пылу, с жару</small></div><span class="arrow">›</span></button>
  <button class="choice-card choice-bar" onclick="openMenu('bar')"><div><div class="choice-title">${t().bar}</div><div class="choice-desc">${t().barSub}</div><small>Sip the Story · Здесь наливают счастье</small></div><span class="arrow">›</span></button>
 </div>`)
}
function openMenu(k){type=k;cat='all';query='';state='menu';render()}
function menuScreen(){
 const title=type==='kitchen'?t().kitchen:t().bar;
 const listCats=categories[type];
 let items=menu.filter(x=>x.type===type);
 if(cat!=='all')items=items.filter(x=>x.cat===cat);
 if(query.trim()){const q=query.toLowerCase();items=items.filter(x=>(trName(x)+' '+trIng(x)).toLowerCase().includes(q))}
 return shell(`<div class="topbar"><button class="back" onclick="state='choice';render()">← ${t().back}</button><div class="small-logo">Le Buffet<span>BISTRO · WINE · COFFEE</span></div><button class="icon-btn" onclick="state='cover';render()">⌂</button></div>
 <div style="text-align:center"><div class="ornament" style="margin:4px 0">❦</div><h1 class="hero-title">${title}</h1></div>
 <div class="glass search">⌕<input value="${esc(query)}" oninput="query=this.value;render()" placeholder="${t().search}"><span>☷</span></div>
 <div class="chips"><button class="chip ${cat==='all'?'active':''}" onclick="cat='all';render()">${t().all}</button>${listCats.map(c=>`<button class="chip ${cat===c[0]?'active':''}" onclick="cat='${c[0]}';render()">${c[1]}</button>`).join('')}</div>
 <div class="menu-list">${items.length?items.map(card).join(''):`<div class="empty">${t().no}</div>`}</div>`)
}
function card(x){
 return `<button class="glass dish-card" onclick="openDish(${x.id})"><img class="dish-img" src="${x.img}" alt=""><div style="text-align:left"><div class="dish-name">${esc(trName(x))}</div><div class="dish-desc">${esc(trIng(x))}</div><div class="badges">${x.tags.map(tag=>`<span class="badge">${tag==='popular'?'🔥 '+t().popular:tag==='chef'?'★ '+t().chef:'● '+t().veg}</span>`).join('')}</div></div><div><div class="price">${x.price.toFixed(2)} ₼</div><div class="time">◷ ${x.time} ${t().min}</div></div></button>`
}
function openDish(id){const x=menu.find(a=>a.id===id);document.body.insertAdjacentHTML('beforeend',`<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeDish()"><div class="modal-box glass fade"><img class="modal-img" src="${x.img}" alt=""><div class="modal-body"><button class="close" onclick="closeDish()">×</button><div class="badges">${x.tags.map(tag=>`<span class="badge">${tag==='popular'?'🔥 '+t().popular:tag==='chef'?'★ '+t().chef:'● '+t().veg}</span>`).join('')}</div><div class="modal-title">${esc(trName(x))}</div><div class="meta"><span>◷ ${x.time} ${t().min}</span><span class="modal-price">${x.price.toFixed(2)} ₼</span></div><div class="divider"></div><b>${t().ingredients}</b><p class="detail-text">${esc(trIng(x))}</p><button class="primary" style="width:100%;margin-top:10px" onclick="closeDish()">✓ ${lang==='az'?'BAĞLA':lang==='ru'?'ЗАКРЫТЬ':'CLOSE'}</button></div></div></div>`)}
function closeDish(){document.getElementById('modal')?.remove()}
function render(){document.getElementById('app').innerHTML=state==='cover'?cover():state==='choice'?choice():menuScreen()}
render();
</script>
