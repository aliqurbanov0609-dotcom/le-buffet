<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Le Buffet — Menu</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
}

html,
body {
    width: 100%;
    min-height: 100%;
    background: #17110d;
    font-family: Georgia, "Times New Roman", serif;
}

body {
    overflow-x: hidden;
    color: #f8eee0;
}

/* =========================
   APP
========================= */

#app {
    width: 100%;
    min-height: 100vh;
    position: relative;
}

/* =========================
   SCREENS
========================= */

.screen {
    width: 100%;
    min-height: 100vh;
    position: relative;
    display: none;
    overflow: hidden;
}

.screen.active {
    display: block;
}

/* =========================
   COVER
========================= */

#cover {
    background-image: url("cover.jpg");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
    min-height: 100vh;
    cursor: pointer;
}

#cover::after {
    content: "";
    position: absolute;
    inset: 0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.12),
            rgba(0,0,0,.04) 45%,
            rgba(0,0,0,.35)
        );
    pointer-events: none;
}

.cover-touch {
    position: absolute;
    inset: 0;
    z-index: 5;
}

/* =========================
   LANGUAGE
========================= */

.language {
    position: absolute;
    left: 50%;
    bottom: 8%;
    transform: translateX(-50%);
    z-index: 10;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;

    font-family: Arial, sans-serif;
    font-size: 15px;
    letter-spacing: 5px;
    white-space: nowrap;
}

.language button {
    border: 0;
    background: transparent;
    color: #fff6e9;
    font: inherit;
    letter-spacing: inherit;
    cursor: pointer;
    padding: 5px;
    opacity: .6;
}

.language button.active {
    opacity: 1;
    text-shadow: 0 0 12px rgba(255,235,190,.8);
}

/* =========================
   COVER CTA
========================= */

.cover-cta {
    position: absolute;
    left: 50%;
    bottom: 3%;
    transform: translateX(-50%);
    z-index: 10;

    width: 90%;
    text-align: center;

    font-family: Arial, sans-serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: #fff4df;
}

/* =========================
   CHOICE SCREEN
========================= */

#choice {
    background-image: url("choice.jpg");
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat;
}

#choice::after {
    content: "";
    position: absolute;
    inset: 0;
    background: rgba(20, 10, 5, .08);
    pointer-events: none;
}

.choice-content {
    position: relative;
    z-index: 5;

    min-height: 100vh;
    width: 100%;

    display: flex;
    flex-direction: column;
    align-items: center;
}

.choice-language {
    position: absolute;
    top: 3%;
    left: 50%;
    transform: translateX(-50%);
}

/* Invisible buttons placed exactly over
   the MƏTBƏX and BAR areas of the image */

.choice-button {
    position: absolute;
    left: 13%;
    width: 74%;
    height: 16%;
    border: 0;
    background: transparent;
    cursor: pointer;
    z-index: 20;
}

.kitchen-button {
    top: 31%;
}

.bar-button {
    top: 53%;
}

/* =========================
   MENU SCREEN
========================= */

#menu {
    background:
        linear-gradient(rgba(42,25,15,.92), rgba(42,25,15,.96)),
        url("choice.jpg") center/cover fixed;
    min-height: 100vh;
}

.menu-inner {
    width: 100%;
    max-width: 700px;
    margin: auto;
    padding: 25px 18px 40px;
}

.menu-header {
    text-align: center;
    padding: 10px 0 25px;
}

.menu-logo {
    font-size: 44px;
    font-style: italic;
    font-weight: normal;
    color: #f8e8cc;
}

.menu-subtitle {
    margin-top: 5px;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 4px;
    color: #d9c1a0;
}

.menu-title {
    margin-top: 20px;
    font-size: 34px;
    letter-spacing: 3px;
    color: #fff3df;
}

.menu-category {
    margin-top: 15px;
    text-align: center;
    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    color: #d7b98f;
}

/* =========================
   CATEGORY LIST
========================= */

.categories {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.category {
    width: 100%;
    min-height: 64px;

    border: 1px solid rgba(232,205,165,.6);
    border-radius: 35px;

    background: rgba(30,18,11,.72);
    backdrop-filter: blur(8px);

    color: #f9ead4;
    padding: 12px 20px;

    text-align: center;
    font-family: Georgia, serif;
    font-size: 20px;

    cursor: pointer;
    transition: .2s;
}

.category:active {
    transform: scale(.97);
    background: rgba(255,225,185,.18);
}

/* =========================
   DISHES
========================= */

.dishes {
    display: none;
    flex-direction: column;
    gap: 12px;
}

.dishes.active {
    display: flex;
}

.dish {
    border: 1px solid rgba(230,202,160,.4);
    border-radius: 18px;

    background: rgba(25,15,9,.82);
    padding: 17px;

    display: flex;
    justify-content: space-between;
    gap: 15px;
}

.dish-info {
    flex: 1;
}

.dish-name {
    font-size: 20px;
    color: #fff0d8;
}

.dish-description {
    margin-top: 7px;
    font-family: Arial, sans-serif;
    font-size: 11px;
    line-height: 1.5;
    color: #cbb79d;
}

.dish-price {
    white-space: nowrap;
    font-family: Arial, sans-serif;
    font-size: 16px;
    color: #e4c18e;
}

/* =========================
   NAVIGATION
========================= */

.back-button {
    width: 100%;
    margin-bottom: 15px;

    border: 1px solid rgba(232,205,165,.5);
    border-radius: 30px;

    background: rgba(20,12,7,.7);
    color: #f5dfc1;

    padding: 13px;

    font-family: Arial, sans-serif;
    font-size: 12px;
    letter-spacing: 2px;
    cursor: pointer;
}

.home-button {
    position: fixed;
    bottom: 15px;
    right: 15px;

    width: 46px;
    height: 46px;

    border: 1px solid rgba(255,230,190,.6);
    border-radius: 50%;

    background: rgba(20,12,7,.85);
    color: #fff0d8;

    z-index: 100;
    cursor: pointer;
}

/* =========================
   RESPONSIVE
========================= */

@media (min-width: 700px) {
    .screen {
        max-width: 600px;
        margin: auto;
    }

    body {
        background: #0e0906;
    }
}
</style>
</head>

<body>

<div id="app">

    <!-- =====================
         SCREEN 1 — COVER
    ====================== -->

    <section id="cover" class="screen active">

        <div class="cover-touch" onclick="openChoice()"></div>

        <div class="language">
            <button id="langAZ" class="active" onclick="setLanguage('az'); event.stopPropagation();">
                AZ
            </button>

            <span>•</span>

            <button id="langRU" onclick="setLanguage('ru'); event.stopPropagation();">
                RU
            </button>

            <span>•</span>

            <button id="langEN" onclick="setLanguage('en'); event.stopPropagation();">
                EN
            </button>
        </div>

        <div
            id="coverCTA"
            class="cover-cta"
            onclick="openChoice(); event.stopPropagation();">
            DAVAM ETMƏK ÜÇÜN TOXUNUN
        </div>

    </section>


    <!-- =====================
         SCREEN 2 — CHOICE
    ====================== -->

    <section id="choice" class="screen">

        <div class="choice-content">

            <div class="language choice-language">

                <button id="choiceAZ"
                        class="active"
                        onclick="setLanguage('az')">
                    AZ
                </button>

                <span>•</span>

                <button id="choiceRU"
                        onclick="setLanguage('ru')">
                    RU
                </button>

                <span>•</span>

                <button id="choiceEN"
                        onclick="setLanguage('en')">
                    EN
                </button>

            </div>

            <!-- Кнопка КУХНЯ -->
            <button
                class="choice-button kitchen-button"
                onclick="openKitchen()"
                aria-label="Kitchen">
            </button>

            <!-- Кнопка BAR -->
            <button
                class="choice-button bar-button"
                onclick="openBar()"
                aria-label="Bar">
            </button>

        </div>

    </section>


    <!-- =====================
         SCREEN 3 — MENU
    ====================== -->

    <section id="menu" class="screen">

        <div class="menu-inner">

            <div class="menu-header">

                <div class="menu-logo">
                    Le Buffet
                </div>

                <div class="menu-subtitle">
                    BISTRO · WINE · COFFEE
                </div>

                <div id="menuTitle" class="menu-title">
                    MƏTBƏX
                </div>

                <div id="menuCategoryText" class="menu-category">
                    LƏZZƏTİN ÜNVANI
                </div>

            </div>


            <button
                class="back-button"
                onclick="openChoice()"
                id="backButton">
                ← GERİ
            </button>


            <!-- КУХНЯ -->

            <div id="kitchenCategories" class="categories">

                <button class="category" onclick="showDishes('starters')">
                    <span data-az="Başlanğıclar"
                          data-ru="Закуски"
                          data-en="Starters">
                        Başlanğıclar
                    </span>
                </button>

                <button class="category" onclick="showDishes('soups')">
                    <span data-az="Şorbalar"
                          data-ru="Супы"
                          data-en="Soups">
                        Şorbalar
                    </span>
                </button>

                <button class="category" onclick="showDishes('salads')">
                    <span data-az="Salatlar"
                          data-ru="Салаты"
                          data-en="Salads">
                        Salatlar
                    </span>
                </button>

                <button class="category" onclick="showDishes('sandwiches')">
                    <span data-az="Sendviçlər və səhər yeməkləri"
                          data-ru="Сэндвичи и завтраки"
                          data-en="Sandwiches & Breakfast">
                        Sendviçlər və səhər yeməkləri
                    </span>
                </button>

                <button class="category" onclick="showDishes('pasta')">
                    <span data-az="Pasta və qarnir"
                          data-ru="Паста и гарниры"
                          data-en="Pasta & Garnish">
                        Pasta və qarnir
                    </span>
                </button>

                <button class="category" onclick="showDishes('poultry')">
                    <span data-az="Quş əti"
                          data-ru="Птица"
                          data-en="Poultry">
                        Quş əti
                    </span>
                </button>

                <button class="category" onclick="showDishes('meat')">
                    <span data-az="Ət yeməkləri"
                          data-ru="Мясные блюда"
                          data-en="Meat">
                        Ət yeməkləri
                    </span>
                </button>

                <button class="category" onclick="showDishes('seafood')">
                    <span data-az="Dəniz məhsulları"
                          data-ru="Морепродукты"
                          data-en="Seafood">
                        Dəniz məhsulları
                    </span>
                </button>

                <button class="category" onclick="showDishes('desserts')">
                    <span data-az="Desertlər və isti içkilər"
                          data-ru="Десерты и горячие напитки"
                          data-en="Desserts & Hot Drinks">
                        Desertlər və isti içkilər
                    </span>
                </button>

            </div>


            <!-- BAR -->

            <div id="barCategories"
                 class="categories"
                 style="display:none;">

                <button class="category" onclick="showDishes('soft')">
                    <span data-az="Alkoqolsuz içkilər"
                          data-ru="Безалкогольные напитки"
                          data-en="Soft Drinks">
                        Alkoqolsuz içkilər
                    </span>
                </button>

                <button class="category" onclick="showDishes('beer')">
                    <span data-az="Pivə"
                          data-ru="Пиво"
                          data-en="Beer">
                        Pivə
                    </span>
                </button>

                <button class="category" onclick="showDishes('wine')">
                    <span data-az="Şərab"
                          data-ru="Вино"
                          data-en="Wine">
                        Şərab
                    </span>
                </button>

                <button class="category" onclick="showDishes('strong')">
                    <span data-az="Güclü içkilər"
                          data-ru="Крепкие напитки"
                          data-en="Spirits">
                        Güclü içkilər
                    </span>
                </button>

                <button class="category" onclick="showDishes('cocktails')">
                    <span data-az="Kokteyllər"
                          data-ru="Коктейли"
                          data-en="Cocktails">
                        Kokteyllər
                    </span>
                </button>

            </div>


            <!-- DISHES -->

            <div id="dishes" class="dishes"></div>

        </div>

        <button
            class="home-button"
            onclick="openChoice()"
            aria-label="Home">
            ⌂
        </button>

    </section>

</div>


<script>

/* =====================================================
   LANGUAGE
===================================================== */

let currentLanguage = "az";

const translations = {

    az: {
        cta: "DAVAM ETMƏK ÜÇÜN TOXUNUN",
        kitchen: "MƏTBƏX",
        kitchenSub: "LƏZZƏTİN ÜNVANI",
        bar: "BAR",
        barSub: "QƏDƏHDƏKİ HEKAYƏ",
        back: "← GERİ"
    },

    ru: {
        cta: "НАЖМИТЕ, ЧТОБЫ ПРОДОЛЖИТЬ",
        kitchen: "КУХНЯ",
        kitchenSub: "АДРЕС ВКУСА",
        bar: "БАР",
        barSub: "ИСТОРИЯ В БОКАЛЕ",
        back: "← НАЗАД"
    },

    en: {
        cta: "TAP TO CONTINUE",
        kitchen: "KITCHEN",
        kitchenSub: "FROM FIRE TO TABLE",
        bar: "BAR",
        barSub: "SIP THE STORY",
        back: "← BACK"
    }
};


/* =====================================================
   LANGUAGE SWITCH
===================================================== */

function setLanguage(lang) {

    currentLanguage = lang;

    document.documentElement.lang = lang;

    document.getElementById("coverCTA").textContent =
        translations[lang].cta;

    document.getElementById("backButton").textContent =
        translations[lang].back;

    document.querySelectorAll("[data-" + lang + "]")
        .forEach(element => {
            element.textContent =
                element.getAttribute("data-" + lang);
        });


    const buttons = [
        "langAZ",
        "langRU",
        "langEN",
        "choiceAZ",
        "choiceRU",
        "choiceEN"
    ];

    buttons.forEach(id => {
        document.getElementById(id)
            ?.classList.remove("active");
    });

    document.getElementById(
        lang === "az" ? "langAZ" :
        lang === "ru" ? "langRU" : "langEN"
    )?.classList.add("active");

    document.getElementById(
        lang === "az" ? "choiceAZ" :
        lang === "ru" ? "choiceRU" : "choiceEN"
    )?.classList.add("active");


    updateMenuLanguage();
}


/* =====================================================
   SCREEN NAVIGATION
===================================================== */

function showScreen(id) {

    document.querySelectorAll(".screen")
        .forEach(screen => {
            screen.classList.remove("active");
        });

    document.getElementById(id)
        .classList.add("active");

    window.scrollTo({
        top: 0,
        behavior: "instant"
    });
}


function openChoice() {

    showScreen("choice");
}


function openKitchen() {

    document.getElementById("menuTitle").textContent =
        translations[currentLanguage].kitchen;

    document.getElementById("menuCategoryText").textContent =
        translations[currentLanguage].kitchenSub;

    document.getElementById("kitchenCategories").style.display =
        "flex";

    document.getElementById("barCategories").style.display =
        "none";

    document.getElementById("dishes").classList.remove("active");

    showScreen("menu");
}


function openBar() {

    document.getElementById("menuTitle").textContent =
        translations[currentLanguage].bar;

    document.getElementById("menuCategoryText").textContent =
        translations[currentLanguage].barSub;

    document.getElementById("kitchenCategories").style.display =
        "none";

    document.getElementById("barCategories").style.display =
        "flex";

    document.getElementById("dishes").classList.remove("active");

    showScreen("menu");
}


/* =====================================================
   MENU DATA
===================================================== */

const menuData = {

    starters: [
        {
            az: "Başlanğıc",
            ru: "Закуска",
            en: "Starter",
            price: ""
        }
    ],

    soups: [
        {
            az: "Şorba",
            ru: "Суп",
            en: "Soup",
            price: ""
        }
    ],

    salads: [
        {
            az: "Salat",
            ru: "Салат",
            en: "Salad",
            price: ""
        }
    ],

    sandwiches: [
        {
            az: "Sendviç",
            ru: "Сэндвич",
            en: "Sandwich",
            price: ""
        }
    ],

    pasta: [
        {
            az: "Pasta",
            ru: "Паста",
            en: "Pasta",
            price: ""
        }
    ],

    poultry: [
        {
            az: "Quş əti yeməyi",
            ru: "Блюдо из птицы",
            en: "Poultry dish",
            price: ""
        }
    ],

    meat: [
        {
            az: "Ət yeməyi",
            ru: "Мясное блюдо",
            en: "Meat dish",
            price: ""
        }
    ],

    seafood: [
        {
            az: "Dəniz məhsulu",
            ru: "Морепродукты",
            en: "Seafood",
            price: ""
        }
    ],

    desserts: [
        {
            az: "Desert",
            ru: "Десерт",
            en: "Dessert",
            price: ""
        }
    ],

    soft: [
        {
            az: "Alkoqolsuz içki",
            ru: "Безалкогольный напиток",
            en: "Soft drink",
            price: ""
        }
    ],

    beer: [
        {
            az: "Pivə",
            ru: "Пиво",
            en: "Beer",
            price: ""
        }
    ],

    wine: [
        {
            az: "Şərab",
            ru: "Вино",
            en: "Wine",
            price: ""
        }
    ],

    strong: [
        {
            az: "Güclü içki",
            ru: "Крепкий напиток",
            en: "Spirit",
            price: ""
        }
    ],

    cocktails: [
        {
            az: "Kokteyl",
            ru: "Коктейль",
            en: "Cocktail",
            price: ""
        }
    ]
};


/* =====================================================
   SHOW DISHES
===================================================== */

function showDishes(category) {

    const container =
        document.getElementById("dishes");

    const categoriesKitchen =
        document.getElementById("kitchenCategories");

    const categoriesBar =
        document.getElementById("barCategories");

    categoriesKitchen.style.display = "none";
    categoriesBar.style.display = "none";

    container.innerHTML = "";

    const dishes = menuData[category] || [];

    dishes.forEach(dish => {

        const item =
            document.createElement("div");

        item.className = "dish";

        const info =
            document.createElement("div");

        info.className = "dish-info";

        const name =
            document.createElement("div");

        name.className = "dish-name";

        name.textContent =
            dish[currentLanguage];

        info.appendChild(name);

        const price =
            document.createElement("div");

        price.className = "dish-price";

        price.textContent =
            dish.price;

        item.appendChild(info);
        item.appendChild(price);

        container.appendChild(item);
    });

    container.classList.add("active");
}


/* =====================================================
   UPDATE LANGUAGE INSIDE DISHES
===================================================== */

function updateMenuLanguage() {

    const title =
        document.getElementById("menuTitle");

    if (!title) return;

    const text =
        title.textContent;

    if (
        text === "MƏTBƏX" ||
        text === "КУХНЯ" ||
        text === "KITCHEN"
    ) {

        title.textContent =
            translations[currentLanguage].kitchen;

        document.getElementById(
            "menuCategoryText"
        ).textContent =
            translations[currentLanguage].kitchenSub;

    } else if (
        text === "BAR"
    ) {

        title.textContent =
            translations[currentLanguage].bar;

        document.getElementById(
            "menuCategoryText"
        ).textContent =
            translations[currentLanguage].barSub;
    }

    document.querySelectorAll(".dish-name")
        .forEach((element, index) => {

            /* Re-rendering happens when a category
               is opened again. */
        });
}


/* =====================================================
   START
===================================================== */

setLanguage("az");

</script>

</body>
</html>
